name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.3.0
  INFISICAL_PROJECT_SLUG: uwdsc-54e-y
  INFISICAL_API_PATH: /scavenger-hunt/api

jobs:
  setup:
    name: Setup Variables
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ env.NODE_VERSION }}
      pnpm-version: ${{ env.PNPM_VERSION }}
      infisical-project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
      infisical-api-path: ${{ env.INFISICAL_API_PATH }}
      has-render-secret: ${{ steps.render.outputs.has-render-secret }}
    steps:
      - name: Detect Render secret
        id: render
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$RENDER_SERVICE_ID" ]; then
            echo "has-render-secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-render-secret=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Output variables
        run: echo "Variables mapped to outputs."

  build-docker:
    name: Build Docker Image
    needs: setup
    permissions:
      contents: read
      packages: write
    uses: uw-datasci/nexus-workflows/.github/workflows/build-docker.yml@v4
    with:
      node-version: ${{ needs.setup.outputs.node-version }}
      pnpm-version: ${{ needs.setup.outputs.pnpm-version }}
      infisical-project-slug: ${{ needs.setup.outputs.infisical-project-slug }}
      infisical-secret-path: ${{ needs.setup.outputs.infisical-api-path }}
      dockerfile: docker/Dockerfile
      docker-context: "."
    secrets:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}

  deploy-render:
    name: Deploy to Render
    needs: [setup, build-docker]
    # Skipped until Foundry's render_setup creates the service and sets the secrets.
    if: needs.setup.outputs.has-render-secret == 'true'
    runs-on: ubuntu-latest
    steps:
      # Image-backed service: pass imageUrl, not commitId (Render 404s on commitId).
      - name: Trigger Render deploy
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"ghcr.io/${GITHUB_REPOSITORY,,}:latest\"}"